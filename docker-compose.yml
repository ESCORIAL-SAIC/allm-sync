# Despliegue en la VM Debian donde corre AnythingLLM.
#
# allm-sync se conecta DIRECTO al container de AnythingLLM por la red interna
# (anythingllm_default), evitando el reverse proxy (nginx-proxy-manager). Así no
# hay 504 por timeout de embedding ni 413 por tamaño de archivo.
# -> en .env: ALLM_BASE_URL=http://anythingllm:3001
#
# Los secretos van en .env (ver .env / .env.example). NO se commitea.

services:
  allm-sync:
    # Deploy: baja la imagen publicada en GHCR. Fijá una versión con IMAGE_TAG en .env
    # (p. ej. IMAGE_TAG=0.1.0); por defecto usa :latest.
    image: ghcr.io/escorial-saic/allm-sync:${IMAGE_TAG:-latest}
    # Para desarrollo local podés construir en vez de bajar: comentá 'image' y descomentá:
    # build: .
    container_name: allm-sync
    restart: unless-stopped
    env_file:
      - .env
    environment:
      ROOT_PATH: /data/documentos
      STATE_DB_PATH: /state/sync.sqlite
    volumes:
      - docs:/data/documentos:ro   # share de Windows, montado read-only
      - state:/state               # DB de estado persistente
    # Rotación de logs: el worker corre para siempre; sin esto el json-file crece sin límite.
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    networks:
      - allm_net

networks:
  # Red EXTERNA de AnythingLLM (docker network ls -> anythingllm_default).
  # Permite alcanzar el container por su nombre: http://anythingllm:3001
  allm_net:
    external: true
    name: anythingllm_default

volumes:
  # Volumen CIFS que monta el share de Windows. Los valores SMB_* salen del .env.
  # OJO: SMB_DOMAIN debe tener valor (dominio real). Un 'domain=' vacío rompe el
  # mount con "invalid argument" (probado). Montaje validado read-only OK.
  docs:
    driver: local
    driver_opts:
      type: cifs
      device: ${SMB_DEVICE}
      o: "username=${SMB_USER},password=${SMB_PASS},domain=${SMB_DOMAIN},vers=${SMB_VERS},ro,uid=1000,gid=1000,file_mode=0440,dir_mode=0550,iocharset=utf8"
  state:
    driver: local
